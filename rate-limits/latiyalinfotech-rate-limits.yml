polling_cadence:
  method: searched
  note: >-
    Published verbatim by the provider in each Postman request description. This is the closest
    thing to a rate limit the direct contract has: it is guidance, not enforcement, and no header
    or error tells a client when it is exceeded.
  fastest_documented: 700ms
  rules:
  - operation: liveMatch
    cadence: every 700ms
    from: app (client) directly
  - operation: commentary
    cadence: every 1 second
    from: app (client) directly
  - operations: [homeList, liveMatchList]
    cadence: every 1 minute
    from: server cron
  - operations: [scorecardByMatchId, playingXiByMatchId, impactPlayersByMatchId, benchPlayersByMatchId, matchOverHistory, matchProbHistory]
    cadence: every 1 minute, live matches only
    from: server cron
    constraint: do not call for upcoming or finished matches
  - operations: [manOfTheMatch]
    cadence: every 10 minutes, finished matches on today's date
    from: server cron
  - operations: [squadsByMatchId, squadsByMatchIdV1, groupSquadsByMatchId]
    cadence: every 15 minutes, upcoming matches only, 2-day horizon
    from: server cron
  - operations: [upcomingMatches, recentMatches, matchInfo, pointsTable, groupPointsTable]
    cadence: every 30 minutes
    from: server cron
  - operations: [news, newsDetail]
    cadence: twice daily
    from: server cron
  - operations: [seriesList, allSeriesList, playerRanking, teamRanking, playerInfo, venuesDetail, teamList, playerList, and the remaining reference reads]
    cadence: once daily
    from: server cron
  architecture_note: >-
    The provider's stated integration pattern is cache-and-serve: every operation except liveMatch
    and commentary is meant to be pulled by a cron into the customer's own database and served from
    there. Only the two ball-by-ball operations are meant to be called from the end-user app.
