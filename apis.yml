apis:
- name: Cricket Live Line API
  description: >-
    Read-only real-time cricket data API. 51 operations on the apiv5 tier (30 on apiv3), all reads,
    served from https://apicricketchampion.in/apiv{3|4|5}/ with an opaque API token as the final path
    segment, and mirrored on RapidAPI at cricket-live-line4.p.rapidapi.com behind the standard
    X-RapidAPI-Key header. Parameterised calls are POSTs carrying multipart/form-data filters
    (series_id, match_id, player_id, team_a_id/team_b_id, venue_id, news_id); collection reads are
    GETs. Every response uses a {status, msg, data} envelope, and application failures -- including an
    invalid credential -- are returned as HTTP 200 with status:false, so HTTP status codes carry no
    application meaning. The provider publishes no OpenAPI; the contract is two first-party Postman
    Collection v2.0.0 documents linked from its own homepage and saved verbatim under postman/. Base
    URL corrected 2026-09-01 from the marketing host to the real API host, which is named in the
    provider's own RapidAPI listing.
  humanURL: https://latiyalinfotech.com/services/cricket-live-line-api/
  baseURL: https://apicricketchampion.in/apiv5/
