description: >-
  Latiyal Infotech Private Limited (CIN U72200RJ2022PTC084893) is a software development company in
  Kuchera, Rajasthan, India that builds mobile and web applications and sells one API product of its
  own: the Cricket Live Line API. The feed covers 108+ cricket leagues -- international, women's,
  franchise league, domestic, T10 and local -- and returns ball-by-ball live match state, scorecards,
  commentary, playing XI and impact players, squads, points tables, over-by-over and probability
  history, player and team rankings, venue scoring patterns and cricket news. It is a read-only,
  poll-driven REST feed hosted at apicricketchampion.in and sold in four monthly INR tiers direct or
  in four USD tiers through RapidAPI. The published machine-readable contract is a pair of first-party
  Postman collections; there is no OpenAPI, no event surface and no agent surface.
